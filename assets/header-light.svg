<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Rafael Gómez Bermejo, backend engineer">
<style>
  .name { font: 650 46px system-ui, -apple-system, 'Segoe UI', 'Inter', Roboto, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1.2px; fill: #1f2328; animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .kicker { font: 500 12px ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 3px; fill: #656d76; animation: fade 1s ease .1s both; }
  .role { font: 400 15px ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace; fill: #656d76; }
  .role .gt { fill: #6e56cf; }
  .clip { animation: type 2.4s steps(48) .7s both; }
  .cursor { fill: #6e56cf; animation: move 2.4s steps(48) .7s both, blink 1.1s step-end 3.1s infinite; }
  .base { stroke: #656d76; stroke-opacity: .22; }
  .glide { stroke: #6e56cf; stroke-dasharray: 90 900; animation: glide 7s ease-in-out infinite; }
  .edge { stroke: #656d76; stroke-opacity: .45; stroke-width: 1.2; fill: none; stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.1s ease both; }
  .node { fill: #1f2328; animation: fade .6s ease both; }
  .hub { fill: #6e56cf; }
  .ring { fill: none; stroke: #6e56cf; stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-out 1.6s infinite; opacity: 0; }
  .dot { fill: #6e56cf; }
  @keyframes rise { from { opacity: .3; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes type { from { width: 0; } to { width: 434px; } }
  @keyframes move { from { transform: translateX(-432px); } to { transform: translateX(0); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes glide { 0% { stroke-dashoffset: 90; } 50% { stroke-dashoffset: -390; } 100% { stroke-dashoffset: 90; } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .motion { display: none; } }
</style>
