<svg xmlns="http://www.w3.org/2000/svg" width="440" height="132" viewBox="0 0 440 132" role="img" aria-label="obsidian-db-folder: Notion-like databases based on folders, for Obsidian.">
<style>
  .bg { fill: #f6f8fa; stroke: #d0d7de; }
  .edge { fill: none; stroke: #6e56cf; stroke-width: 1.4; stroke-dasharray: 60 1400; stroke-dashoffset: 60; animation: sweep 1.6s cubic-bezier(.4,0,.2,1) .3s both; }
  .name { font: 600 17px system-ui, -apple-system, 'Segoe UI', 'Inter', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #1f2328; }
  .arrow { font: 400 15px system-ui, -apple-system, 'Segoe UI', 'Inter', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #656d76; }
  .desc { font: 400 13px system-ui, -apple-system, 'Segoe UI', 'Inter', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #656d76; }
  .meta { font: 400 12px system-ui, -apple-system, 'Segoe UI', 'Inter', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #656d76; }
  .tag { font: 500 10.5px ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1px; fill: #656d76; }
  .tagbox { fill: none; stroke: #d0d7de; }
  .star { fill: #6e56cf; }
  @keyframes sweep { from { stroke-dashoffset: 60; opacity: 1; } 85% { opacity: 1; } to { stroke-dashoffset: -1080; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .motion { display: none; } }
</style>
